[package]
name = "mercato-desktop"
version = "1.0.0"
description = "Mercato Merchant Backend Management System with Desktop Pet Companion"
authors = ["Mercato"]
edition = "2021"

[lib]
name = "mercato_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
